<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Accept until zero</title>
	<script>
		var sum = 0;
		var avg = 0;
		var n = 0;
		while(true)
		{
			var a = parseInt(prompt("Enter a number"));
			n++;
			if(a==0)
			{
				break;
			}
			sum = sum + a;
			avg = sum/n;
		}
		alert("Sum of all the numbers is : " + sum);
		alert("Avg of all the numbers is : " + avg);
		alert("Total numbers entered : " + n);
	</script>
</head>
<body>
</body>
</html>
