<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>EMI</title>
	<style>
		/*CSS using variables*/
		:root                  
		{
			--blue : blue;
			--red : red;
		}
		.error
		{
			color: var(--red);
			font-size: 22px;
			transition: opacity 3s ease;
		}
		.error1
		{
			color: var(--blue);
			font-size: 22px;
			transition: opacity 3s ease;
		}
		.hide
		{
			opacity: 0;
		}
		#home
		{
			position: absolute;
			left: 350px;
			top: 35px;
		}
		#heading
		{
			position: absolute;
			top: 20px;
			left: 410px;
		}
		.Loan_details
		{
			height: 380px;
			width: 720px;
			position: absolute;
			top: 100px;
			left: 350px;
			font-size: 22px;
			/*border: 2px solid black;*/
		}
		.input
		{
			height: 30px;
			width: 710px;
		}
		/*CSS on button*/
		#btn-emi
		{
			height: 40px;
			width: 717px;
			font-size: 22px;
		}
		#btn-emi
		{ 
		     &:disabled,
		     fieldset:disabled
		     {
		        cursor: not-allowed;
		     }
		}
		#emi_calculate
		{
			display: none;
			position: absolute;
			top: 500px;
			left: 350px;
			font-size: 20px;
		}
		/*CSS on table*/
		.table
		{
			position: absolute;
			left: 350px;
			top: 620px;
			width: 717px;
		}
		td,th
		{
			text-align: center;
			font-size: 20px;
		}
		th
		{
			background-color: #ebf5fb;
		}

		/*Changes If we want to print*/
		@media print
		{
			#home
			{
				left: 22%;
			}
			#heading
			{
				left: 31%;
			}
			#btn-emi, .Loan_details
			{
				display: none;
			}
			#emi_calculate
			{
				position: absolute;
				top: 130px;
				left: 25%;
			}
			.table
			{
				position: absolute;
				top: 270px;
				left: 5%;
			}
		}
	</style>
</head>
<body>
	<!-- Home image start -->
	<img src="C:\Users\Hps\OneDrive\Pictures\EMI-home.svg" id="home">
	<!-- Home image end -->
	<h1 id="heading">Home Loan EMI Calculator</h1>
	<div class="Loan_details">
		Loan Amount (₹) : <br>
		<input type="text" class="input" id="loaned" oninput="comma('loaned')" onkeyup="chalu()" onfocus="dk('lerror', 'Enter loan amount');mk('lerror1', ' (Only numbers)')" placeholder="ex : 100000">
		<br>
		<span id="lerror" class="error"></span><span id="lerror1" class="error1"></span><br><br>
		Annual Interest Rate(%) : <br>
		<input type="text" class="input" id="interest" oninput="comma('interest')" onkeyup="chalu()" onfocus="dk('ierror', 'Enter annual interest rate');mk('ierror1', ' (Only numbers)')" placeholder="ex : 5">
		<br>
		<span id="ierror" class="error"></span><span id="ierror1" class="error1"></span><br><br>
		Tenure (In Years) : <br>
		<input type="text" class="input" id="years" oninput="comma('years')" onkeyup="chalu()" onfocus="dk('yerror', 'Enter years');mk('yerror1', ' (Only numbers except 0)')" placeholder="ex : 4"> 
		<br>
		<span id="yerror" class="error"></span><span id="yerror1" class="error1"></span><br><br>
		<!-- EMI button -->
		<button id="btn-emi" onclick="show_emi()" disabled>Calculate EMI</button>
	</div>
	<!-- Shows all the details of EMI with Interest and total payment -->
	<div id="emi_calculate">
		<b>
			Original Principal Amount : <span id="principal_amount"></span><br>
			Monthly EMI : <span id="month_emi"></span><br>
			Total Interest : <span id="total_interest"></span><br>
			Total Payment : <span id="total_payment"></span>
		</b>
	</div>
	<!-- EMI table -->
	<div class="table"></div>
	<script>
		document.getElementById("loaned").addEventListener('input', function()
    	{
    		this.value = this.value.replace(/[^0-9]/g,'');   //Only numbers are allowed to enter
    		comma('loaned');
    	});
    	document.getElementById("interest").addEventListener('input', function()
    	{
    		this.value = this.value.replace(/[^0-9-.]/g,'');   //Only numbers and . are allowed to enter
    		comma('interest');
    	});
    	document.getElementById("years").addEventListener('input', function()
    	{
    		this.value = this.value.replace(/[^1-9]/g,'');   //Only numbers are allowed to enter except 0
    		comma('years');
    	});

    	//Function for displaying the error msg on every input
    	function dk(id, msg)
    	{
    		let pp = document.getElementById(id);
			pp.innerHTML = msg;

			setTimeout(function()
			{
				pp.classList.add("hide");
				setTimeout(function()
				{
					pp.innerHTML = "";
					pp.classList.remove("hide");
				},3000);
			},2000);
    	}

    	//Function for displaying the error msg on every input
    	function mk(id, msg)
    	{
    		let sp = document.getElementById(id);
			sp.innerHTML = msg;

			setTimeout(function()
			{
				sp.classList.add("hide");
				setTimeout(function()
				{
					sp.innerHTML = "";
					sp.classList.remove("hide");
				},3000);
			},2000);
    	}

    	//Function to insert comma
    	function comma(id)
    	{
    		var num = document.getElementById(id);

			var num1 = num.value.replace(/,/g,"");

			var num2 = Number(num1).toLocaleString("en-IN");

			num.value = num2;
    	}

    	//Function on inputs
    	function chalu()
    	{
    		var Loan = document.getElementById("loaned").value;          //take the value of loan
			var Interest = document.getElementById("interest").value;    //take the value of interest
			var Years = document.getElementById("years").value;		   //take the value of years

			if(Loan!="" && Interest!="" && Years!="")
			{
				document.getElementById("btn-emi").disabled = false;     //btn is enabled if all inputs are filled
				document.getElementById("btn-emi").style.cursor = "pointer";
			}
			else
			{
				document.getElementById("btn-emi").disabled = true; 	 //btn is disabled if all inputs are not filled
				document.getElementById("btn-emi").style.cursor = "not-allowed";
			}

			if(Loan.startsWith(0))
			{
				document.getElementById("loaned").value = "";
			}
			else if(Years.startsWith(0))
			{
				document.getElementById("years").value = "";
			}
    	}


    	// Function when btn is enabled and clicked
		function show_emi()
		{
			var Loan = document.getElementById("loaned").value.replace(/,/g,"");
			var Interest = document.getElementById("interest").value.replace(/,/g,"");
			var Years = document.getElementById("years").value.replace(/,/g,"");

			Loan = parseFloat(Loan);
			Interest = parseFloat(Interest);
			Years = parseFloat(Years);

			var rate = Interest/1200;     //calculate rate
			var months = Years*12;		  //calculate months
			var emi = (rate*Loan)/(1-(1+rate)**-(months));    //calculate emi per month

			document.getElementById("emi_calculate").style.display = "block";   

			//displays the original principal amount
			document.getElementById("principal_amount").innerHTML = "₹ " + Number(Loan).toLocaleString('en-IN');

			//displays the emi
			document.getElementById("month_emi").innerHTML = "₹ " + Number(emi.toFixed(2)).toLocaleString('en-IN');

			//displays the total payment including interest 
			document.getElementById("total_payment").innerHTML = "₹ " + Number((emi*months).toFixed(2)).toLocaleString('en-IN');

			//displays the total interest
			document.getElementById("total_interest").innerHTML = "₹ " + Number(((emi*months)-Loan).toFixed(2)).toLocaleString('en-IN');
 
			var emi_table = document.getElementsByClassName("table")[0];

			var tabled = "<table border=1 cellspacing=0 cellpadding=10 width=717>";     //table is created
			tabled = tabled + "<th>Month</th>";
			tabled = tabled + "<th>EMI(₹)</th>";
			tabled = tabled + "<th>Principal(₹)</th>";
			tabled = tabled + "<th>Interest(₹)</th>";
			tabled = tabled + "<th>Balance(₹)</th>";

			var balance = Loan;   //Initial balance is original principal amount


			// Loop iterates for every month
			for(var i=1;i<=months;i++)
			{
				var month_interest = balance * rate;         //calculates monthly interest
				var month_principal = emi - month_interest;  //calculates monthly principal amount

				tabled = tabled + `<tr>
									 <td>${i}</td>
									 <td>${emi.toFixed(2)}</td>
									 <td>${(emi-((balance*(Interest/100))/12)).toFixed(2)}</td>
									 <td>${((balance*(Interest/100))/12).toFixed(2)}</td>
									 <td>${(balance-(emi-((balance*(Interest/100))/12))).toFixed(2)}</td>
								   </tr>`;
				var balance = balance - month_principal;  //Updates the balance after every month
			}
			emi_table.innerHTML = tabled;		//displays the table when the button is clicked

			document.getElementById("emi_calculate").scrollIntoView({behavior: "smooth"});    //Scrolls directly to the Calculated details of EMI
		}
	</script>
</body>
</html>
