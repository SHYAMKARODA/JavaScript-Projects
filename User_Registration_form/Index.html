		function validateform() 
		{
            var name = document.getElementById("name_box").value;

            var password = document.getElementById("pass").value;
            var mobile = document.getElementById("mobile").value.length === 10;
            var dob = document.getElementById("dob").value;
            var tob = document.getElementById("tob").value;
            var enteredCaptcha = document.getElementById("input_captcha").value;
            var generatedCaptcha = document.getElementById("captcha").getAttribute("data-captcha");

            // if(enteredCaptcha!=generatedCaptcha)
            // {
            // 	document.getElementById("caperror").innerText = "Invalid captcha";
            // }
            // else
            // {
            // 	document.getElementById("caperror").innerText = "";
            // }

            // Count of checked hobbies
            var checkedCountH = document.querySelectorAll('input[name="hobby"]:checked').length;

            // Gender check (Make sure one gender is selected)
            var checkedCountG = document.querySelector('input[name="gender"]:checked');

           // Enable submit button if all conditions are met
           if(name!="" && age!="" && email!="" && password!="" && mobile!="" && dob!="" && tob!="" && enteredCaptcha === generatedCaptcha&& checkedCountH>1 && checkedCountG && fileinput) 
           {
                document.getElementById("submit_button").disabled = false; // Enable submit button
           } 
           else 
           {
                document.getElementById("submit_button").disabled = true; // Disable submit button
           }
        }

        // Attach event listeners to form fields
        window.onload = function() 
        {
            // Adding change listeners for gender and hobbies checkboxes
            var checkboxesH = document.getElementsByName('hobby');
            var checkboxesG = document.getElementsByName('gender');

            for (var i = 0; i < checkboxesH.length; i++) 
            {
                checkboxesH[i].addEventListener('change', validateform);
            }
            for (var i = 0; i < checkboxesG.length; i++) 
            {
                checkboxesG[i].addEventListener('change', validateform);
            }
        };

		var form_timer;
		function date()
		{
			var d = new Date();
			document.getElementById("show").innerText=d.toLocaleTimeString("en-us");
			setInterval(function()
			{
				d = new Date();
				document.getElementById("show").innerText=d.toLocaleTimeString("en-us");
			},1000)

			var current = d.getHours();
			function timer()
			{
				if(current>=4 && current<12)
				{
					document.getElementById("msg").innerText="Good Morning";
					document.getElementById("image").src="Images/morning.png";
				}
				else if(current>=12 && current<17)
				{
					document.getElementById("msg").innerText="Good Afternoon";
					document.getElementById("image").src="Images/afternoon.png";
				}
				else if(current>=17 && current<20)
				{
					document.getElementById("msg").innerText="Good Evening";
					document.getElementById("image").src="Images/evening.png";
				}
				else
				{
					document.getElementById("msg").innerText="Good Night";
					document.getElementById("image").src="Images/night.png";
				}
			}
			timer();
		}
		function updateset()
		{
			var MI=parseInt(document.getElementById("min").innerText);
            var SE=parseInt(document.getElementById("sec").innerText);
            if(SE==0 && MI==0)
            {
                clearInterval(form_timer);
                window.location.href="C:/Users/Hps/OneDrive/Desktop/Diwali_Project/Try_again.html";
                return;
            }
            if(SE==0)
            {
                MI--;
                SE=59;
            }
            else 
            {
                SE--;
            }
            document.getElementById("min").innerText=MI;
            document.getElementById("sec").innerText=SE;
		}
		function load()
        {
            form_timer = setInterval(updateset,1000);
        }

		function passed()
		{
			var data=document.getElementById("pass").value;
			var l=data.length;
			// var PASS=document.getElementById("pass").value;
			if(data=="")
			{
				document.getElementById("perror").innerText="";
			}
			else if(l==1 && l<=4)
			{
				document.getElementById("perror").innerText="Poor Password";
				document.getElementById("perror").style.color="red";
			}
			else if(l>4 && l<8)
			{
				document.getElementById("perror").innerText="Good Password";
				document.getElementById("perror").style.color="lightblue";
			}
			else if(l>=8)
			{
				document.getElementById("perror").innerText="Strong Password";
				document.getElementById("perror").style.color="lightgreen";
			}
		}
		function passwordcheck(DATA)
		{
			var Eightchar = new RegExp('(?=.{8,})');
            var Uppercase = new RegExp('(?=.*[A-Z])');
            var Lowercase = new RegExp('(?=.*[a-z])');
            var Numeric = new RegExp('(?=.*[0-9])');
            var Special = new RegExp('(?=.*[!@#$%^&])');

            if(Eightchar.test(DATA))
            {
              document.getElementById("eight").style.color="yellow";  
            }
            else 
            {
               document.getElementById("eight").style.color="red";
               document.getElementById("submit_button").disabled = true;
            }
   
            if(Uppercase.test(DATA))
            {
               document.getElementById("upper").style.color="yellow"; 
            }
            else 
            {
               document.getElementById("upper").style.color="red";
               document.getElementById("submit_button").disabled = true; 
            }

            if(Lowercase.test(DATA))
            {
               document.getElementById("lower").style.color="yellow";   
            }
            else 
            {
               document.getElementById("lower").style.color="red";
               document.getElementById("submit_button").disabled = true;  
            }
   
            if(Numeric.test(DATA))
            {
               document.getElementById("numeric").style.color="yellow";    
            }
            else 
            {
               document.getElementById("numeric").style.color="red";
               document.getElementById("submit_button").disabled = true;  
            }

            if(Special.test(DATA))
            {
               document.getElementById("special").style.color="yellow";    
            }
            else 
            {
               document.getElementById("special").style.color="red";
               document.getElementById("submit_button").disabled = true;  
            }
		}

        //Captcha generate code start
        function generate_captcha() 
    	{
            var string = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*(){}";
            var captcha = "";
            for(var i=0;i<4;i++) 
            {
                var random_string = Math.floor(Math.random() * string.length);
                captcha = captcha + string[random_string];
            }
            return captcha;
        }
        function display_captcha()
        {
            var mixed = generate_captcha();
            document.getElementById("captcha_text").innerText = mixed;
            document.getElementById("captcha").setAttribute("data-captcha", mixed);
